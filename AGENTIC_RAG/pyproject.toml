[project]
name = "langchain-graph-course"
version = "0.1.0"
description = "A course on building agentic applications with LangChain, LangGraph and RAG."
readme = "README.md"
requires-python = ">=3.10, <3.13"
dependencies = [
    "tiktoken",
    "langchain",
    "langchain-text-splitters",
    "langchain-unstructured",
    "unstructured",
    "langgraph",
    "langchain-openai",
    "python-dotenv",
    "black",
    "isort",
    "pytest",
    "langchain-chroma",
    "langchain-tavily>=0.1.5,<0.2.0",
    "beautifulsoup4>=4.15.0",
]
